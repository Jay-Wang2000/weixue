  - id: feat-agent-service
    name: "Agent service on the Claude Agent SDK (M2)"
    branch: feat/agent-service
    description: |
      DESIGN.md M2 feat-agent-service + ADR-10/11、docs/briefs/feat-agent-service.md：独立 Python 服务（Docker，`claude-agent-sdk`，个人 ANTHROPIC_API_KEY 注入，model claude-fable-5-1 + fallback）；每个 chat 一个 SDK session（resume/fork），会话索引持久化；任务 API（POST /tasks、SSE 事件 progress|needs_input|needs_approval|done|failed|cancelled、answer/approve 回传）；连接≠任务的 job 模型，重启恢复；直接调用 ha-mcp（办公室模式与 mcp-bridge 一样加入 wg 命名空间，不设中继），暴露全部 ha-mcp 工具、不加应用层过滤（安全决策只在 ha-mcp policy）；服务内进程内适配器经 HTTP 直连 ha-mcp，实现 ADR-9 唯一契约（约 8 s 预算→pending、保持原请求、裁决走 HTTP /api/policy/approve|deny、pending 期间每 2 s 轮询 /api/policy/pending，不改 wait_seconds；启动时只拒绝能证明归属本服务的 pending 调用）；can_use_tool 只管非 HA 工具；SDK WebSearch/WebFetch 启用；dispatch_dev_job 不在本任务（feat-dev-dispatch）；密钥只来自 server/.env，服务专属 environment 只注入所需键；CLAUDE.md/记忆目录按 setting_sources 加载。首个门禁为 brief §13 S0/S1 清单；开放问题见 brief §14（Q1/Q2/Q3/Q6/Q7/Q8）。端到端：模拟设备客户端发起「把客厅灯做成日落自动化」类长任务（>30 s、≥3 个工具，HA 用只读或测试实体），期间第二个短问不并发、完成后收到 done；一次真实 HA 自由动作经适配器（测试实体与时段待 Q8）。 2026-10-07 决定 36（重写任务模型）：不设 90 s 期限；任务 = 该 chat 在同一 SDK session 内进行中的轮次（不 fork 任务会话）；用户再次唤醒即 interrupt 当前轮并把新消息送入同一会话（进度/改向），agent 从当前状态继续；完成后按投递档位报回；每个 chat 同时只有一个进行中轮次，多任务 = 多个 chat。brief rev 3 为准。
