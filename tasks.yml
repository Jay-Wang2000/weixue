  - id: fix-input-window-routing
    name: "Answer window must not capture unrelated or API messages; silent question cards"
    branch: fix/input-window-routing
    description: |
      Finding 70 (approval-card-queue board run 16:02): after the agent asks a question, for 20 s the service treats ANY message to the device as the answer — an API probe landed in a household chat as the "answer" and the early driver cancelled that chat's task. Fix: the answer window applies only to messages from the same origin/session (voice follow-up on the device, or an explicit answer API with the interaction id); API messages with a chat_id never join another chat; also an ask_user card from an API-originated message is tiered silent and after the window a working item replaces it while the task stays needs_input — a question card is never silent and the working item must not hide an open question. Tests + sim; no device change expected.
