<!doctype html>
<html lang="en" data-embed="0">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>weixue monitor</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/app.css">
<script src="/static/app.js" defer></script>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand chrome">weixue <span>monitor</span></div>
    <div class="verdict" aria-live="polite">
      <span id="v-glyph" class="g g-off" aria-hidden="true"></span>
      <b id="v-word">Connecting</b>
      <span id="v-why" class="why"></span>
    </div>
    <span id="live" class="live"><i aria-hidden="true"></i><span id="live-text">connecting</span></span>
    <span id="clock" class="clock chrome"></span>
    <div class="theme chrome" role="group" aria-label="Theme">
      <button type="button" data-t="auto">Auto</button><button type="button" data-t="light">Light</button><button type="button" data-t="dark">Dark</button>
    </div>
  </div>
</header>

<div class="wrap">
  <div id="banner" class="banner" role="alert" hidden></div>
  <section id="held" class="heldcard" aria-label="Held HA call" hidden></section>
  <section id="context" class="context" aria-label="Context"></section>
  <section id="away" class="away" aria-label="Since you last looked"></section>

  <div class="layout">
    <main>
      <div class="filters">
        <label class="search" role="search">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>
          <input id="q" type="search" placeholder="Search what you said…" aria-label="Search what you said" maxlength="100" autocomplete="off">
        </label>
        <div id="seg" class="seg" role="group" aria-label="Show"></div>
        <select id="f-chat" class="sel hide-ph" aria-label="Chat"><option value="">All chats</option></select>
        <span class="grow"></span>
        <button id="newpill" class="newpill" type="button" hidden></button>
        <label class="hide-ph"><input id="lifecycle" type="checkbox" class="chk"> Lifecycle events</label>
      </div>
      <div id="linked"></div>
      <div id="feed"><p class="empty">Loading…</p></div>
      <button id="older" class="older" type="button" hidden>Older</button>
    </main>
    <aside class="rail">
      <section id="r-chats" aria-label="Chats"></section>
      <section id="r-problems" aria-label="Problems"></section>
      <section id="r-home" aria-label="Home"></section>
    </aside>
  </div>

  <footer class="chrome">Read-only: decide held calls on the device panel or in Home Assistant. Times in <span id="tzname">Europe/Dublin</span>. Model and mode are shown only when a task differs from the usual.</footer>
</div>
</body>
</html>
