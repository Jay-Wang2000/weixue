server:
  websocket: "ws://127.0.0.1:18200/xiaozhi/v1/"
  auth_key: "scratch-sim-key"
  timezone_offset: 1
  auth:
    enabled: true
    allowed_devices: ["aa:bb:cc:dd:ee:01"]
prompt: "Simulated-device run."
close_connection_no_voice_time: 8
enable_greeting: false
wake_cues:
  - {file: config/assets/wake_cues/hmm.wav, text: "Hmm?"}
  - {file: config/assets/wake_cues/mm-hm.wav, text: "Mm-hm?"}
  - {file: config/assets/wake_cues/yes.wav, text: "Yes?"}
end_prompt:
  enable: false
wakeup_words: ["Jarvis"]
# The modules VOICE_LLM=claude_agent renders (scripts/render_config.py).
selected_module:
  VAD: SileroVAD
  ASR: SimASR
  LLM: ClaudeAgentLLM
  TTS: GoogleTTS
  Intent: nointent
  Memory: nomem
ASR:
  SimASR:
    type: sim_asr
    output_dir: tmp/
LLM:
  ClaudeAgentLLM:
    type: claude_agent
TTS:
  GoogleTTS:
    type: google_tts
    speaker: Charon
    default_language: en
    speaking_rate: 1.0
    first_clause: true
    output_dir: tmp/
