server:
  websocket: "ws://127.0.0.1:18200/xiaozhi/v1/"
  auth_key: "scratch-sim-key"
  timezone_offset: 1
  auth:
    enabled: true
    allowed_devices: ["aa:bb:cc:dd:ee:01", "aa:bb:cc:dd:ee:02"]
prompt: "Simulated-device run."
prompt_template: weixue-agent-prompt.txt
close_connection_no_voice_time: 8
barge_in: @@BARGE_IN@@
enable_greeting: false
wake_cues:
  - {file: config/assets/wake_cues/hmm.wav, text: "Hmm?"}
  - {file: config/assets/wake_cues/mm-hm.wav, text: "Mm-hm?"}
  - {file: config/assets/wake_cues/yes.wav, text: "Yes?"}
end_prompt:
  enable: false
wakeup_words: ["Jarvis"]
# Rendered by agent_scenarios.sh with scripts/render_config.py (VOICE_LLM, VOICE_BARGE_IN).
selected_module:
  VAD: SileroVAD
  ASR: SimASR
  LLM: @@VOICE_LLM_MODULE@@
  TTS: GoogleTTS
  Intent: @@VOICE_INTENT@@
  Memory: nomem
ASR:
  SimASR:
    type: sim_asr
    output_dir: tmp/
LLM:
  AnthropicLLM:
    type: anthropic
    model_name: claude-sonnet-5-5
    fallback_model_name: claude-haiku-4-5-20251001
    max_tokens: 1024
    effort: low
    thinking: adaptive
    timeout: 60
    max_retries: 1
  ClaudeAgentLLM:
    type: claude_agent
TTS:
  GoogleTTS:
    type: google_tts
    speaker: Charon
    default_language: en
    speaking_rate: 1.0
    first_clause: true
    output_dir: tmp/
