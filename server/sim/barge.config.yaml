# Rendered by barge_scenarios.sh with scripts/render_config.py (VOICE_BARGE_IN).
server:
  websocket: "ws://127.0.0.1:18300/xiaozhi/v1/"
  auth_key: "scratch-sim-key"
  timezone_offset: 1
  auth:
    enabled: true
    allowed_devices: ["aa:bb:cc:dd:ee:03"]
prompt: "Simulated-device run."
close_connection_no_voice_time: 8
barge_in: @@BARGE_IN@@
enable_greeting: false
wake_cues:
  - {file: config/assets/wake_cues/hmm.wav, text: "Hmm?"}
  - {file: config/assets/wake_cues/mm-hm.wav, text: "Mm-hm?"}
  - {file: config/assets/wake_cues/yes.wav, text: "Yes?"}
end_prompt:
  enable: false
wakeup_words: ["Jarvis"]
selected_module:
  VAD: SileroVAD
  ASR: SimASR
  LLM: SimLLM
  TTS: GoogleTTS
  Intent: nointent
  Memory: nomem
ASR:
  SimASR:
    type: sim_asr
    output_dir: tmp/
LLM:
  SimLLM:
    type: sim_llm
    reply: "Here is a longer answer, so that the playback lasts a while. It has a second sentence. And a third sentence keeps the speaker busy a little longer."
TTS:
  GoogleTTS:
    type: google_tts
    speaker: Charon
    default_language: en
    speaking_rate: 1.0
    output_dir: tmp/
