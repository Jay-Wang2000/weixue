services:
  xiaozhi-esp32-server:
    image: weixue/xiaozhi-esp32-server:local
    build:
      context: .
      additional_contexts:
        upstream: ${WEIXUE_VENDOR:-${HOME}/Projects/weixue-vendor}/xiaozhi-esp32-server
        overlay: ./overlay
      args:
        UPSTREAM_COMMIT: ${UPSTREAM_COMMIT:-unset}
    container_name: xiaozhi-esp32-server
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    environment:
      - TZ=${TZ:-UTC}
      - WEIXUE_TZ=${TZ:-}
      - WEIXUE_PROACTIVE_TOKEN=${WEIXUE_PROACTIVE_TOKEN:-}
      - AGENT_SERVICE_URL=http://${AGENT_SERVICE_HOST:-agent-service}:8010
      - AGENT_SERVICE_TOKEN=${AGENT_SERVICE_TOKEN:-}
      - MONITOR_TOKEN=${MONITOR_TOKEN:-}
    ports:
      - "${BIND_IP:-${LAN_IP:?set LAN_IP in server/.env}}:8000:8000"
      - "${BIND_IP:-${LAN_IP:?set LAN_IP in server/.env}}:8003:8003"
    volumes:
      - ./data:/opt/xiaozhi-esp32-server/data
      - ./data/models/SenseVoiceSmall/model.pt:/opt/xiaozhi-esp32-server/models/SenseVoiceSmall/model.pt
      - ${GOOGLE_SA_FILE:?set GOOGLE_SA_FILE in server/.env}:/run/secrets/google-sa.json:ro
    depends_on:
      - mcp-endpoint-server

  mcp-endpoint-server:
    image: ${UPSTREAM_MCP_ENDPOINT_IMAGE:-ghcr.io/xinnan-tech/mcp-endpoint-server:latest@sha256:33ca12e06dcafb965fb27ecf2631070a267451331b65f0cb0e0332247b0491cc}
    container_name: mcp-endpoint-server
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    environment:
      - TZ=${TZ:-UTC}
    ports:
      - "127.0.0.1:8004:8004"
    volumes:
      - ./data/mcp-endpoint:/app/data

  mcp-bridge:
    image: weixue/mcp-bridge:local
    build:
      context: ./mcp-bridge
    container_name: mcp-bridge
    restart: unless-stopped
    network_mode: ${WG_TUNNEL:+service:wg}
    environment:
      - HA_MCP_URL=${HA_MCP_URL:?set HA_MCP_URL in server/.env}
      - TUNNEL_IFACE=${WG_TUNNEL:+wg0}
    volumes:
      - ./data/mcp-bridge/endpoint-url:/run/secrets/mcp-endpoint-url:ro
      - ./policy/voice_bridge.json:/app/policy/voice_bridge.json:ro
      - ./data/mcp-bridge/cache:/app/cache
      - ./data/mcp-bridge/status:/app/status
    healthcheck:
      test: ["CMD", "python", "-m", "weixue_bridge.health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      mcp-endpoint-server:
        condition: service_started
      wg:
        condition: service_healthy
        required: false

  agent-service:
    image: weixue/agent-service:local
    build:
      context: ./agent-service
      additional_contexts:
        hamcp: ./weixue_hamcp
    container_name: agent-service
    restart: unless-stopped
    network_mode: ${WG_TUNNEL:+service:wg}
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - HA_MCP_URL=${HA_MCP_URL:?set HA_MCP_URL in server/.env}
      - AGENT_SERVICE_TOKEN=${AGENT_SERVICE_TOKEN:-}
      - MONITOR_TOKEN=${MONITOR_TOKEN:-}
      - AGENT_DB=/data/db/agent.db
      - AGENT_HA_PROBE_S=${AGENT_HA_PROBE_S:-10}
      - AGENT_HA_PROBE_TIMEOUT_S=${AGENT_HA_PROBE_TIMEOUT_S:-5}
      - TZ=${TZ:-UTC}
    volumes:
      - ./data/agent-service:/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-m", "weixue_agent.health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      wg:
        condition: service_healthy
        required: false

  agent-monitor:
    image: weixue/agent-monitor:local
    build:
      context: ./agent-monitor
    container_name: agent-monitor
    restart: unless-stopped
    environment:
      - AGENT_SERVICE_URL=http://${AGENT_SERVICE_HOST:-agent-service}:8010
      - MONITOR_TOKEN=${MONITOR_TOKEN:-}
      - GATEWAY_URL=http://xiaozhi-esp32-server:8003
      - MCP_ENDPOINT=mcp-endpoint-server:8004
      - WG_TUNNEL=${WG_TUNNEL:-}
      - AGENT_HA_PROBE_S=${AGENT_HA_PROBE_S:-10}
      - MONITOR_HOME=${MONITOR_HOME:-}
      - TZ=${TZ:-UTC}
    ports:
      - "127.0.0.1:8020:8020"
    # rw so a mode=ro WAL reader can open agent.db-shm after a clean writer shutdown (docs/agent-monitor.md).
    volumes:
      - ./data/agent-service/db:/db
      - ./data/mcp-bridge/status:/bridge:ro
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "python", "-m", "agent_monitor.health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      agent-service:
        condition: service_started

  wg:
    profiles: [tunnel]
    image: weixue/wg:local
    build:
      context: ./wg
    container_name: wg
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    tmpfs:
      - /run/wireguard:mode=0700
    volumes:
      - type: bind
        source: ./.secrets/wg0.conf
        target: /etc/wireguard/wg0.conf
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      start_interval: 5s
      retries: 3

  xiaozhi-esp32-server-web:
    profiles: [console]
    image: ${UPSTREAM_WEB_IMAGE:-ghcr.io/xinnan-tech/xiaozhi-esp32-server:web_latest@sha256:d5dca8a463a2ce9dbbd9a831787eec843774278c58755c365dadcfef4f6d376c}
    container_name: xiaozhi-esp32-server-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8002:8002"
    environment:
      - TZ=${TZ:-UTC}
      - SPRING_DATASOURCE_DRUID_URL=jdbc:mysql://db:3306/xiaozhi_esp32_server?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&nullCatalogMeansCurrent=true&connectTimeout=30000&socketTimeout=30000&autoReconnect=true&failOverReadOnly=false&maxReconnects=10
      - SPRING_DATASOURCE_DRUID_USERNAME=root
      - SPRING_DATASOURCE_DRUID_PASSWORD=${MYSQL_ROOT_PASSWORD:-}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PASSWORD=
      - SPRING_DATA_REDIS_PORT=6379
    volumes:
      - ./data/uploadfile:/uploadfile

  db:
    profiles: [console]
    image: ${MYSQL_IMAGE:-mysql:8@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 45s
      interval: 10s
      retries: 10
    environment:
      - TZ=${TZ:-UTC}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-}
      - MYSQL_DATABASE=xiaozhi_esp32_server
    volumes:
      - ./data/mysql:/var/lib/mysql

  redis:
    profiles: [console]
    image: ${REDIS_IMAGE:-redis:8.0@sha256:ae471bdc20de180beed36e347d170ec0bdf8faa327959ea1f24692f22b05b955}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
